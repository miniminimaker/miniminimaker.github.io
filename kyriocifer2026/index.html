<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE AROUND THE WORLD ♡</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        day: {
                            bg: '#FFFDF9', sky: '#8EDFF2', pink: '#FF6F91', lavender: '#A78BFA',
                            yellow: '#FFD166', mint: '#8ED1B2', orange: '#FFB86B', text: '#26345D',
                            muted: '#69738F', card: '#FFFFFF', border: '#F1EFEA'
                        },
                        night: {
                            bg: '#080D1A', sky: '#111827', pink: '#F43F5E', lavender: '#8B5CF6',
                            yellow: '#FBBF24', mint: '#10B981', orange: '#F97316', text: '#F8FAFC',
                            muted: '#94A3B8', card: '#111827', border: '#1E293B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .leaflet-container { width: 100%; height: 100%; background: #080D1A !important; transition: background 0.5s ease; }
        
        /* Cinematic Night Earth Map Styling & Clarity */
        .dark .leaflet-tile-pane { filter: brightness(0.9) contrast(1.08) saturate(0.75); }

        /* Warm Golden Glowing Heart Marker (♥) */
        @keyframes heart-gentle-pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.7)); }
            50% { transform: scale(1.22); filter: drop-shadow(0 0 14px rgba(251, 191, 36, 0.95)); }
        }
        .city-heart-marker {
            animation: heart-gentle-pulse 2.5s infinite ease-in-out;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            display: flex; align-items: center; justify-content: center;
            color: #FBBF24; font-size: 20px; user-select: none; font-weight: 800;
        }
        .city-heart-marker:hover {
            transform: scale(1.4);
            filter: drop-shadow(0 0 18px rgba(251, 191, 36, 1));
        }

        /* Glowing text effect for native phrases */
        .text-glow {
            text-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
        }

        /* Hide scrollbar for clean carousels */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-day-bg text-day-text dark:bg-night-bg dark:text-night-text flex flex-col overflow-hidden transition-colors duration-300">

    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-day-border dark:border-night-border px-4 py-3 flex items-center justify-between z-40 shrink-0 shadow-sm">
        <div class="flex items-center space-x-3 cursor-pointer group" onclick="returnToWorldView()">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-day-pink to-day-yellow flex items-center justify-center shadow-md shadow-day-pink/20 group-hover:scale-105 transition">
                <i class="fa-solid fa-earth-americas text-white text-lg"></i>
            </div>
            <div>
                <h1 id="headerTitle" class="font-extrabold text-base sm:text-lg bg-gradient-to-r from-day-pink to-day-lavender bg-clip-text text-transparent flex items-center gap-1.5 tracking-tight">
                    LOVE AROUND THE WORLD ♡
                    <!-- Live Sync Indicator -->
                    <span id="liveSyncDot" class="hidden w-2 h-2 rounded-full bg-green-500 animate-pulse shadow-[0_0_5px_#22c55e]" title="Live Sync Active"></span>
                </h1>
                <p class="text-xs text-day-muted dark:text-night-muted font-medium">Light up the world, hear the languages of love ✨</p>
            </div>
        </div>

        <div class="hidden md:flex items-center space-x-3">
            <select id="langFilterSelect" onchange="handleLanguageFilter(this.value)" class="bg-slate-100 dark:bg-slate-800 border border-day-border dark:border-night-border rounded-xl px-3 py-1.5 text-xs font-semibold outline-none cursor-pointer hover:border-day-pink/50 transition-colors">
                <option value="all">🌍 All Languages</option>
            </select>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-day-text dark:text-night-text transition shadow-sm" title="Toggle Theme">
                <i id="themeIcon" class="fa-solid fa-moon text-night-yellow"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden flex flex-col">
        <div id="map" class="w-full h-full absolute inset-0 z-10"></div>

        <!-- Glassmorphic Breadcrumb Overlay -->
        <div id="breadcrumbOverlay" class="absolute top-4 left-4 z-20 flex flex-col sm:flex-row sm:items-center gap-2 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl px-5 py-2.5 rounded-full border border-white/20 dark:border-slate-700/50 shadow-xl text-xs font-medium pointer-events-auto transition-all">
            <div id="breadcrumbTrail" class="flex items-center space-x-2 text-day-muted dark:text-slate-300">
                <!-- Injected via JS -->
            </div>
            <div id="quickReturnBtnContainer" class="hidden sm:pl-3 sm:border-l sm:border-slate-300 dark:sm:border-slate-700">
                <button onclick="returnToWorldView()" class="px-3 py-1.5 bg-day-pink/10 hover:bg-day-pink hover:text-white text-day-pink rounded-full text-[11px] font-bold transition flex items-center space-x-1.5 backdrop-blur-md">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </button>
            </div>
        </div>

        <!-- Unified Dark Popup Card -->
        <div id="cityPopupCard" class="absolute z-30 bg-[#0F172A] border border-slate-700/60 rounded-3xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.5)] p-0 w-72 hidden transform -translate-x-1/2 -translate-y-full mb-4 pointer-events-auto animate-in fade-in zoom-in-95 duration-200 ring-1 ring-white/10">
            <!-- Downward pointing arrow -->
            <div class="absolute -bottom-2.5 left-1/2 transform -translate-x-1/2 w-5 h-5 bg-[#0F172A] border-r border-b border-slate-700/60 rotate-45 rounded-sm"></div>
            
            <button onclick="closeCityPopup()" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition z-10">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>

            <!-- Card Header: Location & Typography Hierarchy -->
            <div class="p-5 flex flex-col items-center justify-center text-center border-b border-slate-800/80 relative overflow-hidden">
                <!-- Soft glow background effect -->
                <div class="absolute inset-0 bg-gradient-to-b from-day-pink/10 to-transparent opacity-50"></div>
                
                <div class="relative z-10 flex flex-col items-center w-full">
                    <div class="text-[10px] text-slate-400 font-bold tracking-widest uppercase flex items-center space-x-1 mb-2">
                        <i class="fa-solid fa-location-dot text-day-pink"></i>
                        <span id="popupLocation">Country • City</span>
                    </div>
                    
                    <div id="popupNativePhrase" class="text-3xl font-black text-white text-glow mb-1 drop-shadow-md">我愛你</div>
                    <div id="popupRomanization" class="text-xs text-slate-300 font-medium mb-3">Wǒ ài nǐ</div>
                    
                    <div id="popupLanguageTag" class="px-3 py-1 bg-slate-800/80 backdrop-blur-sm rounded-full border border-slate-600 text-[10px] text-slate-300 font-bold uppercase tracking-wider">
                        Mandarin
                    </div>
                </div>
            </div>

            <!-- Card Body: Spotify-like Audio List -->
            <div id="popupPeopleList" class="p-3 flex flex-col gap-1 max-h-52 overflow-y-auto no-scrollbar relative z-10 bg-[#0B1120] rounded-b-3xl">
                <!-- Injected via JS -->
            </div>
        </div>

        <div class="absolute bottom-0 inset-x-0 z-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-t border-day-border dark:border-night-border py-3 px-4 flex items-center justify-between shadow-[0_-4px_20px_rgba(0,0,0,0.05)] dark:shadow-[0_-4px_20px_rgba(0,0,0,0.3)]">
            <div class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider hidden md:flex items-center space-x-2 shrink-0 pr-4 border-r border-slate-200 dark:border-slate-700 mr-2">
                <span class="w-2 h-2 rounded-full bg-day-pink animate-pulse shadow-[0_0_8px_#f43f5e]"></span>
                <span>Hear "I love you" from around the world ♡</span>
            </div>
            <div id="countryCarousel" class="flex items-center space-x-3 overflow-x-auto no-scrollbar py-1 flex-1 px-1">
                <!-- Injected via JS -->
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // 1. SUPABASE CONNECTION CONFIGURATION
        // ==========================================
        const YOUR_SUPABASE_URL = 'https://sxuwpcvdnbzettdmrclo.supabase.co';
        const YOUR_SUPABASE_ANON_KEY = 'sb_publishable_YIg5VkT5PG3vZ6zIwTWZhA_Vf9v3Zq6';
        let supabaseClient = null;

        try {
            if (supabase && YOUR_SUPABASE_URL && YOUR_SUPABASE_ANON_KEY) {
                supabaseClient = supabase.createClient(YOUR_SUPABASE_URL, YOUR_SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn('Supabase initialization failed:', e);
        }

        const demoData = {
            countries: [{ id: 'c_tw', name: 'Taiwan', name_en: 'Taiwan', flag: '🇹🇼', lat: 23.6978, lng: 120.9605, zoom: 8 }],
            cities: [{ id: 'ci_taipei', country_id: 'c_tw', name: 'Taipei', name_en: 'Taipei', latitude: 25.0330, longitude: 121.5654 }],
            languages: [{ id: 'l_mandarin', name: 'Mandarin', native_name: '我愛你', romanization: 'Wǒ ài nǐ', audio_url: '' }],
            people: [{ id: 'p1', name: 'MINI (DB Unreachable)', avatar_url: 'https://placehold.co/150x150/ffe4e6/f43f5e?text=M', country_id: 'c_tw', city_id: 'ci_taipei', language_id: 'l_mandarin', active: true }]
        };

        let appData = JSON.parse(JSON.stringify(demoData));
        let map;
        let markersLayer = L.layerGroup();
        let activeCityForBubble = null;
        let activeCountryId = null;
        let activeLanguageFilter = 'all';
        let currentMapLevel = 'world'; 

        // Audio Player State
        let currentAudioPlayer = null;
        let currentActiveBtnId = null;
        let currentActiveIconId = null;
        let currentActiveTextId = null;

        // ==========================================
        // 2. MAP INITIALIZATION & DATA FETCHING
        // ==========================================
        async function initMap() {
            map = L.map('map', {
                zoomControl: false, attributionControl: false, minZoom: 3, maxZoom: 16,
                maxBounds: [[-85, -180], [85, 180]], maxBoundsViscosity: 1.0
            }).setView([20.0, 0.0], 3);

            window.dayTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, minZoom: 3, noWrap: true });
            window.nightTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, minZoom: 3, noWrap: true });

            if (document.documentElement.classList.contains('dark')) {
                window.nightTileLayer.addTo(map);
            } else {
                window.dayTileLayer.addTo(map);
            }

            L.control.zoom({ position: 'bottomright' }).addTo(map);
            markersLayer.addTo(map);

            await fetchAppData();
            renderWorldView();
            renderCountryCarousel();
            populateLanguageFilterOptions();
            updateBreadcrumb();

            map.on('move zoom', updateBubblePosition);
            
            // Replaced WebSocket with Polling for environment stability
            setInterval(fetchAppDataSilently, 10000); 
        }

        async function fetchAppData() {
            if (!supabaseClient) return;
            try {
                const [coRes, ciRes, lRes, pRes] = await Promise.all([
                    supabaseClient.from('countries').select('*'),
                    supabaseClient.from('cities').select('*'),
                    supabaseClient.from('languages').select('*'),
                    supabaseClient.from('people').select('*')
                ]);
                
                if (coRes.data) appData.countries = coRes.data;
                if (ciRes.data) appData.cities = ciRes.data;
                if (lRes.data) appData.languages = lRes.data;
                if (pRes.data) appData.people = pRes.data;
                
                document.getElementById('liveSyncDot').classList.remove('hidden');
            } catch (err) {
                console.warn('Using local seed data due to Supabase fetch error:', err);
            }
        }

        // Silent fetch for polling (updates UI without re-flying map camera)
        async function fetchAppDataSilently() {
            await fetchAppData();
            if (currentMapLevel === 'world') {
                renderWorldView(activeLanguageFilter);
            } else if (currentMapLevel === 'country') {
                renderCountryView(activeCountryId);
            } else if (currentMapLevel === 'city' && activeCityForBubble) {
                const updatedCity = appData.cities.find(c => c.id === activeCityForBubble.id);
                const cityPeople = appData.people.filter(p => p.active && p.city_id === updatedCity.id);
                // Update popup contents silently if open
                if (!document.getElementById('cityPopupCard').classList.contains('hidden')) {
                    showCityPopup(updatedCity, cityPeople);
                }
            }
        }

        // ==========================================
        // 3. MAP RENDERING LOGIC
        // ==========================================
        function renderWorldView(filterLang = 'all') {
            markersLayer.clearLayers();
            currentMapLevel = 'world';
            activeCountryId = null;
            closeCityPopup();
            updateBreadcrumb();

            const activePeople = appData.people.filter(p => p.active);
            const activeCityIds = new Set(activePeople.filter(p => filterLang === 'all' || p.language_id === filterLang).map(p => p.city_id));

            appData.cities.forEach(city => {
                if (!activeCityIds.has(city.id)) return;
                const country = appData.countries.find(c => c.id === city.country_id);
                const cityPeople = activePeople.filter(p => p.city_id === city.id && (filterLang === 'all' || p.language_id === filterLang));
                if (cityPeople.length === 0) return;

                const icon = L.divIcon({
                    className: 'custom-heart-icon',
                    html: `<div class="city-heart-marker" title="${city.name_en || city.name}">♥</div>`,
                    iconSize: [28, 28], iconAnchor: [14, 14]
                });

                const marker = L.marker([city.latitude, city.longitude], { icon });
                marker.bindTooltip(`
                    <div class="p-1 font-sans text-xs">
                        <div class="font-bold text-slate-900 dark:text-white text-sm">📍 ${city.name_en || city.name}</div>
                        <div class="text-day-pink font-semibold">${country ? country.flag + ' ' + (country.name_en || country.name) : ''}</div>
                        <div class="text-slate-500 text-[11px] mt-0.5">${cityPeople.length} people here</div>
                    </div>
                `, { direction: 'top', offset: [0, -8] });
                marker.on('click', () => handleCityClick(city, cityPeople));
                markersLayer.addLayer(marker);
            });
        }

        function flyToCountry(countryId) {
            const country = appData.countries.find(c => c.id === countryId);
            if (!country) return;
            
            currentMapLevel = 'country';
            activeCountryId = country.id;
            closeCityPopup();
            updateBreadcrumb();
            
            const activePeople = appData.people.filter(p => p.active && p.country_id === countryId);
            const countryCityIds = new Set(activePeople.map(p => p.city_id));
            const citiesInCountry = appData.cities.filter(c => c.country_id === countryId && countryCityIds.has(c.id));

            // 動態視角對焦邏輯
            if (country.lat !== undefined && country.lng !== undefined && country.lat !== null) {
                // 如果資料庫有手動設定國家的 lat/lng，直接飛往該座標
                map.flyTo([country.lat, country.lng], country.zoom || 6, { duration: 1.4 });
            } else if (citiesInCountry.length > 0) {
                // 如果沒有國家座標，自動依據城市計算適當的鏡頭範圍
                if (citiesInCountry.length === 1) {
                    // 只有一個城市時，直接對準並放大
                    map.flyTo([citiesInCountry[0].latitude, citiesInCountry[0].longitude], 7, { duration: 1.4 });
                } else {
                    // 有多個城市時，自動縮放以包含所有城市
                    const bounds = L.latLngBounds(citiesInCountry.map(c => [c.latitude, c.longitude]));
                    map.flyToBounds(bounds, { padding: [80, 80], maxZoom: 8, duration: 1.4 });
                }
            }

            renderCountryView(countryId);
        }

        function renderCountryView(countryId) {
            const activePeople = appData.people.filter(p => p.active && p.country_id === countryId);
            const countryCityIds = new Set(activePeople.map(p => p.city_id));
            const country = appData.countries.find(c => c.id === countryId);

            markersLayer.clearLayers();
            appData.cities.filter(c => c.country_id === countryId && countryCityIds.has(c.id)).forEach(city => {
                const cityPeople = activePeople.filter(p => p.city_id === city.id);
                if (cityPeople.length === 0) return;

                const icon = L.divIcon({
                    className: 'custom-heart-icon',
                    html: `<div class="city-heart-marker" title="${city.name_en || city.name}">♥</div>`,
                    iconSize: [28, 28], iconAnchor: [14, 14]
                });
                const marker = L.marker([city.latitude, city.longitude], { icon });
                marker.bindTooltip(`
                    <div class="p-1 font-sans text-xs">
                        <div class="font-bold text-slate-900 dark:text-white text-sm">📍 ${city.name_en || city.name}</div>
                        <div class="text-day-pink font-semibold">${country.flag} ${country.name_en || country.name}</div>
                        <div class="text-slate-500 text-[11px] mt-0.5">${cityPeople.length} people here</div>
                    </div>
                `, { direction: 'top', offset: [0, -8] });
                marker.on('click', () => handleCityClick(city, cityPeople));
                markersLayer.addLayer(marker);
            });
        }

        function handleCityClick(city, cityPeople) {
            currentMapLevel = 'city';
            activeCityForBubble = city;
            updateBreadcrumb();
            map.flyTo([city.latitude, city.longitude], 11, { duration: 1.2 });
            showCityPopup(city, cityPeople);
        }

        // ==========================================
        // 4. UNIFIED POPUP & AUDIO LOGIC
        // ==========================================
        function showCityPopup(city, people) {
            if (!people || people.length === 0) return;
            const country = appData.countries.find(c => c.id === city.country_id);
            const firstPersonLang = appData.languages.find(l => l.id === people[0].language_id);

            // Set Format: Country • City with Pin Icon
            const countryName = country ? (country.name_en || country.name) : '';
            const cityName = city.name_en || city.name;
            const locText = `${countryName} • ${cityName}`;
            
            document.getElementById('popupLocation').innerText = locText;
            
            // Set Header Texts
            document.getElementById('popupNativePhrase').innerText = firstPersonLang ? firstPersonLang.native_name : '我愛你';
            document.getElementById('popupRomanization').innerText = firstPersonLang ? firstPersonLang.romanization : '';
            document.getElementById('popupLanguageTag').innerText = firstPersonLang ? firstPersonLang.name : 'Language';

            // Generate Audio Player List
            const listContainer = document.getElementById('popupPeopleList');
            listContainer.innerHTML = '';

            people.forEach((person, index) => {
                const btnId = `playBtn_${index}`;
                const iconId = `playIcon_${index}`;
                const textId = `statusText_${index}`;
                const lang = appData.languages.find(l => l.id === person.language_id);
                const audioUrl = lang ? lang.audio_url : null;

                const item = document.createElement('div');
                item.className = 'flex items-center space-x-3 p-2.5 rounded-2xl hover:bg-slate-800/80 transition-colors group cursor-pointer';
                item.onclick = () => playPersonAudio(audioUrl, btnId, iconId, textId);

                item.innerHTML = `
                    <div id="${btnId}" class="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center group-hover:border-day-pink group-hover:shadow-[0_0_12px_rgba(244,63,94,0.4)] transition-all shrink-0">
                        <i id="${iconId}" class="fa-solid fa-play text-slate-300 group-hover:text-day-pink ml-0.5 text-xs"></i>
                    </div>
                    <div class="relative w-12 h-12 shrink-0">
                        <div class="absolute inset-0 rounded-full bg-day-pink blur-sm opacity-0 group-hover:opacity-60 transition-opacity"></div>
                        <img src="${person.avatar_url}" class="relative w-full h-full rounded-full object-cover border-[1.5px] border-transparent group-hover:border-day-pink transition-all" onerror="this.src='https://placehold.co/100x100/1e293b/f8fafc?text=👤'">
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <div class="font-bold text-sm text-white truncate">${person.name_en || person.name}</div>
                        <div class="text-[10px] text-slate-400 flex items-center space-x-1.5 mt-0.5">
                            <i class="fa-solid fa-microphone-lines text-slate-500"></i>
                            <span id="${textId}" class="truncate">Voice Message</span>
                        </div>
                    </div>
                `;
                listContainer.appendChild(item);
            });

            const card = document.getElementById('cityPopupCard');
            card.classList.remove('hidden');
            positionElementOverCity(card, city.latitude, city.longitude);
        }

        function closeCityPopup() {
            document.getElementById('cityPopupCard').classList.add('hidden');
            resetAudioState();
        }

        function returnToWorldView() {
            closeCityPopup();
            activeCityForBubble = null;
            activeCountryId = null;
            currentMapLevel = 'world';
            map.flyTo([20.0, 0.0], 3, { duration: 1.5 });
            renderWorldView(activeLanguageFilter);
            updateBreadcrumb();
        }

        function updateBreadcrumb() {
            const trail = document.getElementById('breadcrumbTrail');
            const returnBtnContainer = document.getElementById('quickReturnBtnContainer');
            if (!trail) return;

            if (currentMapLevel === 'world') {
                trail.innerHTML = `<span class="text-day-pink font-extrabold flex items-center space-x-1.5 tracking-wide"><i class="fa-solid fa-earth-americas"></i><span>World</span></span>`;
                if (returnBtnContainer) returnBtnContainer.classList.add('hidden');
            } else if (currentMapLevel === 'country') {
                const country = appData.countries.find(c => c.id === activeCountryId);
                const countryName = country ? country.flag + ' ' + (country.name_en || country.name) : 'Country';
                trail.innerHTML = `
                    <button onclick="returnToWorldView()" class="hover:text-day-pink transition-colors font-semibold">World</button>
                    <span class="text-slate-400/50">›</span>
                    <span class="text-day-pink font-bold">${countryName}</span>
                `;
                if (returnBtnContainer) returnBtnContainer.classList.remove('hidden');
            } else if (currentMapLevel === 'city') {
                const country = appData.countries.find(c => c.id === activeCityForBubble?.country_id);
                const countryName = country ? country.flag + ' ' + (country.name_en || country.name) : 'Country';
                const cityName = activeCityForBubble ? (activeCityForBubble.name_en || activeCityForBubble.name) : 'City';
                trail.innerHTML = `
                    <button onclick="returnToWorldView()" class="hover:text-day-pink transition-colors font-semibold">World</button>
                    <span class="text-slate-400/50">›</span>
                    <button onclick="flyToCountry('${country?.id}')" class="hover:text-day-pink transition-colors font-semibold">${countryName}</button>
                    <span class="text-slate-400/50">›</span>
                    <span class="text-day-pink font-bold">📍 ${cityName}</span>
                `;
                if (returnBtnContainer) returnBtnContainer.classList.remove('hidden');
            }
        }

        function positionElementOverCity(element, lat, lng) {
            if (!map) return;
            const latLng = L.latLng(lat, lng);
            const point = map.latLngToContainerPoint(latLng);
            element.style.left = `${point.x}px`;
            element.style.top = `${point.y}px`;
        }

        function updateBubblePosition() {
            if (!activeCityForBubble) return;
            const card = document.getElementById('cityPopupCard');
            if (!card.classList.contains('hidden')) {
                positionElementOverCity(card, activeCityForBubble.latitude, activeCityForBubble.longitude);
            }
        }

        function playPersonAudio(audioUrl, btnId, iconId, textId) {
            if (!audioUrl) {
                console.warn('No audio file provided.');
                return;
            }

            resetAudioState();

            currentAudioPlayer = new Audio(audioUrl);
            currentActiveBtnId = btnId;
            currentActiveIconId = iconId;
            currentActiveTextId = textId;

            const btn = document.getElementById(btnId);
            const icon = document.getElementById(iconId);
            const text = document.getElementById(textId);

            if (btn) btn.classList.add('animate-pulse', 'border-day-pink', 'shadow-[0_0_12px_rgba(244,63,94,0.4)]');
            if (icon) {
                icon.className = 'fa-solid fa-volume-high text-day-pink text-xs';
                icon.classList.remove('ml-0.5'); // center volume icon visually
            }
            if (text) {
                text.innerText = 'Playing...';
                text.classList.add('text-day-pink');
            }

            currentAudioPlayer.play().catch(e => {
                console.warn('Audio play failed:', e);
                resetAudioState();
            });

            currentAudioPlayer.onended = resetAudioState;
            currentAudioPlayer.onerror = resetAudioState;
        }

        function resetAudioState() {
            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
                currentAudioPlayer = null;
            }
            if (currentActiveBtnId) {
                const btn = document.getElementById(currentActiveBtnId);
                const icon = document.getElementById(currentActiveIconId);
                const text = document.getElementById(currentActiveTextId);
                
                if (btn) btn.classList.remove('animate-pulse', 'border-day-pink', 'shadow-[0_0_12px_rgba(244,63,94,0.4)]');
                if (icon) {
                    icon.className = 'fa-solid fa-play text-slate-300 group-hover:text-day-pink ml-0.5 text-xs';
                }
                if (text) {
                    text.innerText = 'Voice Message';
                    text.classList.remove('text-day-pink');
                }
                
                currentActiveBtnId = null;
                currentActiveIconId = null;
                currentActiveTextId = null;
            }
        }

        function renderCountryCarousel() {
            const carousel = document.getElementById('countryCarousel');
            carousel.innerHTML = '';

            appData.countries.forEach(country => {
                const btn = document.createElement('button');
                btn.className = 'flex items-center space-x-2 px-4 py-2 bg-white dark:bg-slate-800 hover:bg-day-pink/10 border border-day-border dark:border-slate-700 rounded-full text-[13px] font-bold text-day-text dark:text-night-text shrink-0 transition-all hover:scale-105 shadow-sm hover:border-day-pink/50';
                btn.innerHTML = `<span class="text-base">${country.flag}</span><span>${country.name_en || country.name}</span>`;
                btn.onclick = () => flyToCountry(country.id);
                carousel.appendChild(btn);
            });
        }

        function populateLanguageFilterOptions() {
            const select = document.getElementById('langFilterSelect');
            select.innerHTML = '<option value="all">🌍 All Languages</option>';
            appData.languages.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l.id;
                opt.textContent = l.name;
                select.appendChild(opt);
            });
        }

        function handleLanguageFilter(langId) {
            activeLanguageFilter = langId;
            renderWorldView(langId);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-sun text-day-yellow';
                map.removeLayer(window.nightTileLayer);
                window.dayTileLayer.addTo(map);
                localStorage.setItem('theme', 'day');
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-moon text-night-yellow';
                map.removeLayer(window.dayTileLayer);
                window.nightTileLayer.addTo(map);
                localStorage.setItem('theme', 'night');
            }
        }

        if (localStorage.getItem('theme') === 'day') {
            document.documentElement.classList.remove('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-sun text-day-yellow';
        } else {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-moon text-night-yellow';
        }

        window.onload = initMap;
    </script>
</body>
</html>
