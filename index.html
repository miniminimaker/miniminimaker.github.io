<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <!-- =========================
         Basic Settings
    ========================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>miniminimaker</title>


    <!-- =========================
         Styles
    ========================== -->

    <style>

        /* =========================
           Basic Reset
        ========================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5f3ef;

            color: #333;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           Main Container
        ========================== */

        .container {

            width: 100%;

            max-width: 1000px;

            margin: 0 auto;

            padding:
                60px 30px 30px;

            flex: 1;
        }


        /* =========================
           Header
        ========================== */

        header {

            text-align: center;

            margin-bottom: 60px;
        }


        .logo {

            width: 90px;
            height: 90px;

            object-fit: contain;

            display: block;

            margin:
                0 auto 22px;
        }


        h1 {

            margin:
                0 0 10px;

            font-size: 36px;

            font-weight: 700;

            letter-spacing: 0.3px;
        }


        .subtitle {

            margin: 0;

            color: #777;

            font-size: 15px;

            line-height: 1.8;
        }


        /* =========================
           Main Categories
        ========================== */

        .categories {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 30px;

            width: 100%;
        }


        /* =========================
           Category Card
        ========================== */

        .card {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 320px;

            padding:
                45px 35px;

            background: #ffffff;

            border:
                1px solid #dedbd5;

            border-radius: 22px;

            text-decoration: none;

            color: inherit;

            text-align: center;

            box-shadow:
                0 4px 14px
                rgba(0, 0, 0, 0.04);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }


        .card:hover {

            transform:
                translateY(-7px);

            box-shadow:
                0 14px 35px
                rgba(0, 0, 0, 0.10);

            border-color:
                #cfcac2;
        }


        .card:focus-visible {

            outline:
                3px solid #9b8fd1;

            outline-offset: 5px;
        }


        /* =========================
           Card Images
        ========================== */

        .card-icon {

            width: 120px;
            height: 120px;

            object-fit: contain;

            display: block;

            margin-bottom: 25px;

            transition:
                transform 0.25s ease;
        }


        .card:hover .card-icon {

            transform:
                scale(1.05);
        }


        /* =========================
           Card Titles
        ========================== */

        .card h2 {

            margin:
                0 0 10px;

            font-size: 25px;

            font-weight: 700;

            letter-spacing: 0.2px;

            line-height: 1.4;
        }


        /* Chinese Subtitle */

        .chinese-title {

            font-size: 16px;

            font-weight: 500;

            color: #888;
        }


        /* =========================
           Card Description
        ========================== */

        .card p {

            margin: 0;

            color: #777;

            font-size: 14px;

            line-height: 1.8;
        }


        /* =========================
           Footer
        ========================== */

        footer {

            margin-top: 70px;

            padding:
                30px 20px 35px;

            text-align: center;

            color: #888;

            font-size: 13px;

            line-height: 2;
        }


        footer a {

            color: #777;

            text-decoration: none;

            transition:
                color 0.2s ease;
        }


        footer a:hover {

            color: #555;

            text-decoration: underline;
        }


        footer a:focus-visible {

            outline:
                2px solid #9b8fd1;

            outline-offset: 3px;
        }


        /* =========================
           Mobile
        ========================== */

        @media (max-width: 700px) {


            .container {

                padding:
                    45px 20px 20px;
            }


            header {

                margin-bottom: 40px;
            }


            .logo {

                width: 75px;
                height: 75px;

                margin-bottom: 18px;
            }


            h1 {

                font-size: 30px;
            }


            .subtitle {

                font-size: 14px;
            }


            .categories {

                grid-template-columns:
                    1fr;

                gap: 20px;
            }


            .card {

                min-height: 280px;

                padding:
                    40px 25px;

                border-radius: 20px;
            }


            .card-icon {

                width: 105px;
                height: 105px;

                margin-bottom: 20px;
            }


            .card h2 {

                font-size: 23px;
            }


            .chinese-title {

                font-size: 15px;
            }


            footer {

                margin-top: 45px;
            }

        }


        /* =========================
           Reduced Motion
        ========================== */

        @media (prefers-reduced-motion: reduce) {

            html {

                scroll-behavior: auto;
            }


            *,
            *::before,
            *::after {

                transition:
                    none !important;

                animation:
                    none !important;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         Main Content
    ========================== -->

    <main class="container">


        <!-- =========================
             Header
        ========================== -->

        <header>


            <!-- Main Website Logo -->

            <img
                src="minilogo.png"
                alt="miniminimaker logo"
                class="logo"
            >


            <h1>
                miniminimaker
            </h1>


            <p class="subtitle">

                My personal space &amp; KY archive
                <br>

                我的個人空間與 KY 收藏

            </p>


        </header>



        <!-- =========================
             Main Categories
        ========================== -->

        <section
            class="categories"
            aria-label="Main categories"
        >


            <!-- =====================
                 About Me
            ====================== -->

            <a
                href="/about/"
                class="card"
                aria-label="About Me 關於我"
            >


                <!-- About Me Image -->

                <img
                    src="minipfp.png"
                    alt="About Me"
                    class="card-icon"
                >


                <!-- Title -->

                <h2>

                    About Me

                    <br>

                    <span class="chinese-title">
                        關於我
                    </span>

                </h2>


                <!-- Description -->

                <p>

                    About me, commissions,
                    <br>

                    and my creative work.
                    <br>

                    關於我、委託與創作。

                </p>


            </a>



            <!-- =====================
                 Kyrio Cifer
            ====================== -->

            <a
                href="/kyriocifer/"
                class="card"
                aria-label="Kyrio Cifer KY 收藏"
            >


                <!-- KY Image -->

                <img
                    src="kylogo.png"
                    alt="Kyrio Cifer"
                    class="card-icon"
                >


                <!-- Title -->

                <h2>

                    Kyrio Cifer

                    <br>

                    <span class="chinese-title">
                        KY 收藏
                    </span>

                </h2>


                <!-- Description -->

                <p>

                    A collection of KY's
                    <br>

                    stream projects and archives.
                    <br>

                    KY 的直播相關企劃與收藏。

                </p>


            </a>


        </section>



        <!-- =========================
             Footer
        ========================== -->

        <footer>


            <!-- Made With -->

            <div>

                Made with ♡ by

                <a
                    href="https://x.com/miniminimaker"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    MINIMINI
                </a>

            </div>


            <!-- Copyright -->

            <div>

                © 2026

                <a
                    href="https://x.com/miniminimaker"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    miniminimaker
                </a>

            </div>


        </footer>


    </main>


</body>

</html>
