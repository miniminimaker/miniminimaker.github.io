<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE AROUND THE WORLD ♡ 點亮世界，聽見愛的語言</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        day: {
                            bg: '#FFFDF9',
                            sky: '#8EDFF2',
                            pink: '#FF6F91',
                            lavender: '#A78BFA',
                            yellow: '#FFD166',
                            mint: '#8ED1B2',
                            orange: '#FFB86B',
                            text: '#26345D',
                            muted: '#69738F',
                            card: '#FFFFFF',
                            border: '#F1EFEA'
                        },
                        night: {
                            bg: '#080D1A',
                            sky: '#111827',
                            pink: '#F43F5E',
                            lavender: '#8B5CF6',
                            yellow: '#FBBF24',
                            mint: '#10B981',
                            orange: '#F97316',
                            text: '#F8FAFC',
                            muted: '#94A3B8',
                            card: '#111827',
                            border: '#1E293B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .leaflet-container { width: 100%; height: 100%; background: #080D1A !important; transition: background 0.5s ease; }
        
        /* Cinematic Night Earth Map Styling & Clarity */
        .dark .leaflet-tile-pane {
            filter: brightness(0.9) contrast(1.08) saturate(0.75);
        }

        /* Warm Golden Glowing Heart Marker (♥) with Gentle 2.5s Pulse Animation */
        @keyframes heart-gentle-pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.7)); }
            50% { transform: scale(1.22); filter: drop-shadow(0 0 14px rgba(251, 191, 36, 0.95)); }
        }
        .city-heart-marker {
            animation: heart-gentle-pulse 2.5s infinite ease-in-out;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FBBF24;
            font-size: 20px;
            user-select: none;
            font-weight: 800;
        }
        .city-heart-marker:hover {
            transform: scale(1.4);
            filter: drop-shadow(0 0 18px rgba(251, 191, 36, 1));
        }

        /* Hide scrollbar for clean carousels */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-day-bg text-day-text dark:bg-night-bg dark:text-night-text flex flex-col overflow-hidden transition-colors duration-300">

    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-day-border dark:border-night-border px-4 py-3 flex items-center justify-between z-40 shrink-0">
        <div class="flex items-center space-x-3 cursor-pointer group" onclick="returnToWorldView()">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-day-pink to-day-yellow flex items-center justify-center shadow-md shadow-day-pink/20 group-hover:scale-105 transition">
                <i class="fa-solid fa-earth-americas text-white text-lg"></i>
            </div>
            <div>
                <h1 id="headerTitle" class="font-extrabold text-base sm:text-lg bg-gradient-to-r from-day-pink to-day-lavender bg-clip-text text-transparent flex items-center gap-1.5">
                    LOVE AROUND THE WORLD ♡
                    <!-- Live Sync Indicator -->
                    <span id="liveSyncDot" class="hidden w-2 h-2 rounded-full bg-green-500 animate-pulse shadow-[0_0_5px_#22c55e]" title="已連線至資料庫，即時同步中"></span>
                </h1>
                <p class="text-xs text-day-muted dark:text-night-muted">點亮世界，聽見愛的語言 ✨</p>
            </div>
        </div>

        <!-- Controls: Language Filter Only -->
        <div class="hidden md:flex items-center space-x-3">
            <select id="langFilterSelect" onchange="handleLanguageFilter(this.value)" class="bg-slate-100 dark:bg-slate-800 border border-day-border dark:border-night-border rounded-xl px-3 py-1.5 text-xs font-semibold outline-none cursor-pointer">
                <option value="all">🌍 All Languages</option>
            </select>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Day/Night Toggle -->
            <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-day-text dark:text-night-text transition shadow-sm" title="Toggle Theme">
                <i id="themeIcon" class="fa-solid fa-moon text-night-yellow"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden flex flex-col">
        <!-- Leaflet Map Container -->
        <div id="map" class="w-full h-full absolute inset-0 z-10"></div>

        <!-- Breadcrumb & Navigation Overlay -->
        <div id="breadcrumbOverlay" class="absolute top-4 left-4 z-20 flex flex-col sm:flex-row sm:items-center gap-2 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-day-border dark:border-night-border shadow-lg text-xs font-semibold pointer-events-auto">
            <div id="breadcrumbTrail" class="flex items-center space-x-2 text-day-muted">
                <!-- Injected via JS -->
            </div>
            <div id="quickReturnBtnContainer" class="hidden sm:pl-2 sm:border-l sm:border-day-border dark:sm:border-night-border">
                <button onclick="returnToWorldView()" class="px-2.5 py-1 bg-day-pink/10 hover:bg-day-pink hover:text-white text-day-pink rounded-xl text-[11px] font-bold transition flex items-center space-x-1">
                    <span>🌎</span>
                    <span>回到主畫面</span>
                </button>
            </div>
        </div>

        <!-- City People Selector Popup Card -->
        <div id="cityPeopleCard" class="absolute z-30 bg-white dark:bg-slate-900 border border-day-border dark:border-night-border rounded-3xl shadow-2xl p-5 w-72 hidden transform -translate-x-1/2 -translate-y-full mb-3 pointer-events-auto animate-in fade-in zoom-in-95 duration-200">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-day-border dark:border-night-border">
                <div>
                    <div id="cardCityName" class="font-extrabold text-sm text-day-text dark:text-night-text">Taipei</div>
                    <div id="cardCityCount" class="text-[11px] text-day-muted">5 people here</div>
                </div>
                <button onclick="closeCityPeopleCard()" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 flex items-center justify-center text-day-muted transition">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
            <div id="cardPeopleAvatarList" class="flex flex-col gap-2 max-h-44 overflow-y-auto py-1 no-scrollbar">
                <!-- Injected via JS -->
            </div>
            <div class="mt-3 pt-3 border-t border-day-border dark:border-night-border flex flex-col gap-2">
                <button onclick="returnToWorldView()" class="w-full py-2 bg-slate-100 dark:bg-slate-800 hover:bg-day-pink/10 text-day-text dark:text-night-text hover:text-day-pink rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 shadow-sm">
                    <span>🌎</span>
                    <span>回到主畫面</span>
                </button>
            </div>
        </div>

        <!-- Person Speech Bubble Popup -->
        <div id="personSpeechBubble" class="absolute z-30 bg-white dark:bg-slate-900 border-2 border-day-pink/40 rounded-3xl shadow-2xl p-5 w-80 hidden transform -translate-x-1/2 -translate-y-full mb-4 pointer-events-auto animate-in fade-in zoom-in-95 duration-200">
            <div class="absolute -bottom-3 left-1/2 transform -translate-x-1/2 w-5 h-5 bg-white dark:bg-slate-900 border-r-2 border-b-2 border-day-pink/40 rotate-45"></div>
            
            <div class="flex items-start justify-between mb-3">
                <div class="flex items-center space-x-3">
                    <img id="bubbleAvatar" src="" alt="Avatar" class="w-14 h-14 rounded-full object-cover border-2 border-day-pink shadow-md" onerror="this.src='https://placehold.co/100x100/ffe4e6/f43f5e?text=👤'">
                    <div>
                        <h3 id="bubbleName" class="font-extrabold text-base text-day-text dark:text-night-text">MINI</h3>
                        <div class="text-xs text-day-muted flex items-center space-x-1.5 mt-0.5">
                            <span id="bubbleCountryFlag">🇹🇼</span>
                            <span id="bubbleCountryName">Taiwan</span>
                            <span>•</span>
                            <span id="bubbleCityName" class="text-day-pink font-semibold">Taipei</span>
                        </div>
                    </div>
                </div>
                <button onclick="closePersonBubble()" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 flex items-center justify-center text-day-muted transition" title="關閉對話框">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <!-- Love Phrase Box -->
            <div class="bg-day-bg dark:bg-slate-800/80 rounded-2xl p-4 text-center border border-day-border dark:border-night-border shadow-inner">
                <div class="text-[10px] text-day-muted uppercase tracking-widest font-bold mb-1" id="bubbleLangName">Mandarin</div>
                <div id="bubbleLovePhrase" class="text-2xl font-black text-day-pink my-1">我愛你</div>
                <div id="bubbleRomanization" class="text-xs italic text-day-text dark:text-night-text">Wǒ ài nǐ</div>
                <div id="bubbleTranslation" class="text-[11px] text-day-muted mt-0.5">I love you</div>

                <!-- Audio Play Button & Return to World -->
                <div class="mt-3 pt-3 border-t border-day-border dark:border-night-border flex flex-col gap-2">
                    <button onclick="playPersonAudio()" id="audioPlayBtn" class="w-full py-2 bg-gradient-to-r from-day-pink to-day-lavender text-white rounded-xl text-xs font-bold shadow-md shadow-day-pink/30 hover:opacity-90 transition flex items-center justify-center space-x-2 active:scale-95">
                        <i class="fa-solid fa-volume-high" id="audioIcon"></i>
                        <span id="audioBtnText">🔊 播放真人語音</span>
                    </button>
                    <button onclick="returnToWorldView()" class="w-full py-2 bg-slate-100 dark:bg-slate-800 hover:bg-day-pink/10 text-day-text dark:text-night-text hover:text-day-pink rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 shadow-sm">
                        <span>🌎</span>
                        <span>回到主畫面</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 inset-x-0 z-20 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t border-day-border dark:border-night-border py-3 px-4 flex items-center justify-between shadow-lg">
            <div class="text-xs font-bold text-day-muted hidden md:flex items-center space-x-2 shrink-0 pr-3">
                <span class="w-2 h-2 rounded-full bg-day-pink animate-pulse"></span>
                <span>聽聽各地的「我愛你 ♡」:</span>
            </div>
            <div id="countryCarousel" class="flex items-center space-x-2.5 overflow-x-auto no-scrollbar py-1 flex-1 px-1">
                <!-- Injected via JS -->
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // 1. SUPABASE 資料庫連線設定
        // ==========================================
        const YOUR_SUPABASE_URL = 'https://sxuwpcvdnbzettdmrclo.supabase.co';
        
        // 填入您提供的完整 Publishable Key
        const YOUR_SUPABASE_ANON_KEY = 'sb_publishable_YIg5VkT5PG3vZ6zIwTWZhA_Vf9v3Zq6';

        let supabaseClient = null;

        try {
            if (supabase && YOUR_SUPABASE_URL && YOUR_SUPABASE_ANON_KEY) {
                supabaseClient = supabase.createClient(YOUR_SUPABASE_URL, YOUR_SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn('Supabase initialization failed:', e);
        }

        // Default Rich Seed Data (當資料庫沒連上時的備用假資料)
        const demoData = {
            countries: [
                { id: 'c_tw', name: 'Taiwan', flag: '🇹🇼', country_code: 'TW', lat: 23.6978, lng: 120.9605, zoom: 8 }
            ],
            cities: [
                { id: 'ci_taipei', country_id: 'c_tw', name: 'Taipei', latitude: 25.0330, longitude: 121.5654 }
            ],
            languages: [
                { id: 'l_mandarin', name: 'Mandarin (中文)', native_name: '我愛你', romanization: 'Wǒ ài nǐ', translation: 'I love you', audio_url: 'https://actions.google.com/sounds/v1/ambiences/morning_birds.ogg' }
            ],
            people: [
                { id: 'p1', name: 'MINI (如果看到這個代表資料庫連線失敗或無資料)', avatar_url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', country_id: 'c_tw', city_id: 'ci_taipei', language_id: 'l_mandarin', active: true }
            ]
        };

        let appData = JSON.parse(JSON.stringify(demoData));
        let map;
        let markersLayer = L.layerGroup();
        let currentSelectedPerson = null;
        let activeCityForBubble = null;
        let activeCountryId = null;
        let activeLanguageFilter = 'all';
        let currentAudioPlayer = null;
        let currentMapLevel = 'world'; // 'world' | 'country' | 'city'

        // ==========================================
        // 2. 初始化地圖與資料取得
        // ==========================================
        async function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                minZoom: 3,
                maxZoom: 16,
                maxBounds: [[-85, -180], [85, 180]],
                maxBoundsViscosity: 1.0
            }).setView([20.0, 0.0], 3);

            window.dayTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 16, minZoom: 3, noWrap: true
            });

            window.nightTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 16, minZoom: 3, noWrap: true
            });

            if (document.documentElement.classList.contains('dark')) {
                window.nightTileLayer.addTo(map);
            } else {
                window.dayTileLayer.addTo(map);
            }

            L.control.zoom({ position: 'bottomright' }).addTo(map);
            markersLayer.addTo(map);

            await fetchAppData();
            renderWorldView();
            renderCountryCarousel();
            populateLanguageFilterOptions();
            updateBreadcrumb();

            map.on('move zoom', updateBubblePosition);
            
            // 啟動即時資料更新監聽
            setupRealtimeUpdates();
        }

        async function fetchAppData() {
            if (!supabaseClient) return;
            try {
                const [coRes, ciRes, lRes, pRes] = await Promise.all([
                    supabaseClient.from('countries').select('*'),
                    supabaseClient.from('cities').select('*'),
                    supabaseClient.from('languages').select('*'),
                    supabaseClient.from('people').select('*')
                ]);
                
                // 強制將真實資料庫的資料覆蓋上去 (即使是空的也覆蓋)
                if (coRes.data) appData.countries = coRes.data;
                if (ciRes.data) appData.cities = ciRes.data;
                if (lRes.data) appData.languages = lRes.data;
                if (pRes.data) appData.people = pRes.data;
                
                // 若連線成功，顯示左上角的綠燈
                document.getElementById('liveSyncDot').classList.remove('hidden');
            } catch (err) {
                console.log('Using local seed data due to Supabase fetch error:', err);
            }
        }

        // ==========================================
        // 3. Supabase Realtime 即時更新功能
        // ==========================================
        function setupRealtimeUpdates() {
            if (!supabaseClient) return;
            
            supabaseClient
                .channel('public:people')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'people' }, (payload) => {
                    console.log('後台資料有更新了！即時重新整理畫面...', payload);
                    
                    // 重新抓取資料並繪製
                    fetchAppData().then(() => {
                        if (currentMapLevel === 'world') {
                            renderWorldView(activeLanguageFilter);
                        } else if (currentMapLevel === 'country') {
                            flyToCountry(activeCountryId);
                        } else if (currentMapLevel === 'city' && activeCityForBubble) {
                            const updatedCity = appData.cities.find(c => c.id === activeCityForBubble.id);
                            const cityPeople = appData.people.filter(p => p.active && p.city_id === updatedCity.id);
                            handleCityClick(updatedCity, cityPeople);
                        }
                    });
                })
                .subscribe();
        }

        // ==========================================
        // 4. 地圖渲染邏輯
        // ==========================================
        function renderWorldView(filterLang = 'all') {
            markersLayer.clearLayers();
            currentMapLevel = 'world';
            activeCountryId = null;
            closeCityPeopleCard();
            closePersonBubble();
            updateBreadcrumb();

            const activePeople = appData.people.filter(p => p.active);
            const activeCityIds = new Set(
                activePeople
                    .filter(p => filterLang === 'all' || p.language_id === filterLang)
                    .map(p => p.city_id)
            );

            appData.cities.forEach(city => {
                if (!activeCityIds.has(city.id)) return;
                const country = appData.countries.find(c => c.id === city.country_id);
                const cityPeople = activePeople.filter(p => p.city_id === city.id && (filterLang === 'all' || p.language_id === filterLang));
                if (cityPeople.length === 0) return;

                const heartHtml = `
                    <div class="city-heart-marker" title="${city.name}">
                        ♥
                    </div>
                `;

                const icon = L.divIcon({
                    className: 'custom-heart-icon',
                    html: heartHtml,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([city.latitude, city.longitude], { icon });

                marker.bindTooltip(`
                    <div class="p-1 font-sans text-xs">
                        <div class="font-bold text-slate-900 dark:text-white text-sm">📍 ${city.name}</div>
                        <div class="text-day-pink font-semibold">${country ? country.flag + ' ' + country.name : ''}</div>
                        <div class="text-slate-500 text-[11px] mt-0.5">${cityPeople.length} people here</div>
                    </div>
                `, { direction: 'top', offset: [0, -8] });

                marker.on('click', () => {
                    handleCityClick(city, cityPeople);
                });

                markersLayer.addLayer(marker);
            });
        }

        function flyToCountry(countryId) {
            const country = appData.countries.find(c => c.id === countryId);
            if (!country) return;

            currentMapLevel = 'country';
            activeCountryId = country.id;
            closeCityPeopleCard();
            closePersonBubble();
            updateBreadcrumb();

            map.flyTo([country.lat, country.lng], country.zoom, { duration: 1.4 });

            const activePeople = appData.people.filter(p => p.active && p.country_id === countryId);
            const countryCityIds = new Set(activePeople.map(p => p.city_id));

            markersLayer.clearLayers();
            appData.cities.filter(c => c.country_id === countryId && countryCityIds.has(c.id)).forEach(city => {
                const cityPeople = activePeople.filter(p => p.city_id === city.id);
                if (cityPeople.length === 0) return;

                const heartHtml = `
                    <div class="city-heart-marker" title="${city.name}">
                        ♥
                    </div>
                `;
                const icon = L.divIcon({
                    className: 'custom-heart-icon',
                    html: heartHtml,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
                const marker = L.marker([city.latitude, city.longitude], { icon });
                marker.bindTooltip(`
                    <div class="p-1 font-sans text-xs">
                        <div class="font-bold text-slate-900 dark:text-white text-sm">📍 ${city.name}</div>
                        <div class="text-day-pink font-semibold">${country.flag} ${country.name}</div>
                        <div class="text-slate-500 text-[11px] mt-0.5">${cityPeople.length} people here</div>
                    </div>
                `, { direction: 'top', offset: [0, -8] });
                marker.on('click', () => {
                    handleCityClick(city, cityPeople);
                });
                markersLayer.addLayer(marker);
            });
        }

        function handleCityClick(city, cityPeople) {
            currentMapLevel = 'city';
            activeCityForBubble = city;
            updateBreadcrumb();

            map.flyTo([city.latitude, city.longitude], 11, { duration: 1.2 });

            if (cityPeople.length === 1) {
                closeCityPeopleCard();
                openPersonBubble(cityPeople[0], city);
            } else if (cityPeople.length > 1) {
                closePersonBubble();
                showCityPeopleCard(city, cityPeople);
            }
        }

        // ==========================================
        // 5. 彈出視窗與互動邏輯
        // ==========================================
        function showCityPeopleCard(city, people) {
            const country = appData.countries.find(c => c.id === city.country_id);
            document.getElementById('cardCityName').innerText = `${country ? country.flag : ''} ${city.name}`;
            document.getElementById('cardCityCount').innerText = `${people.length} people here`;

            const listContainer = document.getElementById('cardPeopleAvatarList');
            listContainer.innerHTML = '';

            people.forEach(person => {
                const lang = appData.languages.find(l => l.id === person.language_id);
                const btn = document.createElement('button');
                btn.className = 'flex items-center space-x-2.5 p-2 bg-slate-50 dark:bg-slate-800 hover:bg-day-pink/10 rounded-2xl border border-day-border dark:border-night-border transition group w-full text-left';
                btn.onclick = () => {
                    closeCityPeopleCard();
                    openPersonBubble(person, city);
                };
                btn.innerHTML = `
                    <img src="${person.avatar_url}" class="w-10 h-10 rounded-full object-cover border-2 border-day-pink shadow-sm" onerror="this.src='https://placehold.co/100x100/ffe4e6/f43f5e?text=👤'">
                    <div class="overflow-hidden flex-1">
                        <div class="font-bold text-xs text-day-text dark:text-night-text group-hover:text-day-pink transition truncate">${person.name}</div>
                        <div class="text-[10px] text-day-muted truncate">${lang ? lang.native_name + ' (' + lang.translation + ')' : ''}</div>
                    </div>
                `;
                listContainer.appendChild(btn);
            });

            const card = document.getElementById('cityPeopleCard');
            card.classList.remove('hidden');
            positionElementOverCity(card, city.latitude, city.longitude);
        }

        function closeCityPeopleCard() {
            document.getElementById('cityPeopleCard').classList.add('hidden');
        }

        function openPersonBubble(person, city) {
            currentSelectedPerson = person;
            activeCityForBubble = city;

            const country = appData.countries.find(c => c.id === person.country_id);
            const lang = appData.languages.find(l => l.id === person.language_id);

            document.getElementById('bubbleAvatar').src = person.avatar_url;
            document.getElementById('bubbleName').innerText = person.name;
            document.getElementById('bubbleCountryFlag').innerText = country ? country.flag : '🌎';
            document.getElementById('bubbleCountryName').innerText = country ? country.name : '';
            document.getElementById('bubbleCityName').innerText = city ? city.name + ' City' : '';

            document.getElementById('bubbleLangName').innerText = lang ? lang.name : 'Love Phrase';
            document.getElementById('bubbleLovePhrase').innerText = lang ? lang.native_name : '我愛你';
            document.getElementById('bubbleRomanization').innerText = lang ? lang.romanization : '';
            document.getElementById('bubbleTranslation').innerText = lang ? lang.translation : '';

            const bubble = document.getElementById('personSpeechBubble');
            bubble.classList.remove('hidden');
            positionElementOverCity(bubble, city.latitude, city.longitude);
        }

        function closePersonBubble() {
            document.getElementById('personSpeechBubble').classList.add('hidden');
            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
                currentAudioPlayer = null;
            }
            resetAudioBtn();
        }

        function returnToWorldView() {
            closeCityPeopleCard();
            closePersonBubble();

            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
                currentAudioPlayer = null;
            }
            resetAudioBtn();

            currentSelectedPerson = null;
            activeCityForBubble = null;
            activeCountryId = null;
            currentMapLevel = 'world';

            map.flyTo([20.0, 0.0], 3, { duration: 1.5 });
            renderWorldView(activeLanguageFilter);
            updateBreadcrumb();
        }

        function updateBreadcrumb() {
            const trail = document.getElementById('breadcrumbTrail');
            const returnBtnContainer = document.getElementById('quickReturnBtnContainer');
            if (!trail) return;

            if (currentMapLevel === 'world') {
                trail.innerHTML = `<span class="text-day-pink font-extrabold flex items-center space-x-1.5"><i class="fa-solid fa-earth-americas"></i><span>World View</span></span>`;
                if (returnBtnContainer) returnBtnContainer.classList.add('hidden');
            } else if (currentMapLevel === 'country') {
                const country = appData.countries.find(c => c.id === activeCountryId);
                trail.innerHTML = `
                    <button onclick="returnToWorldView()" class="hover:text-day-pink transition">World</button>
                    <span class="text-day-muted">›</span>
                    <span class="text-day-pink font-bold">${country ? country.flag + ' ' + country.name : 'Country'}</span>
                `;
                if (returnBtnContainer) returnBtnContainer.classList.remove('hidden');
            } else if (currentMapLevel === 'city') {
                const country = appData.countries.find(c => c.id === activeCityForBubble?.country_id);
                trail.innerHTML = `
                    <button onclick="returnToWorldView()" class="hover:text-day-pink transition">World</button>
                    <span class="text-day-muted">›</span>
                    <button onclick="flyToCountry('${country?.id}')" class="hover:text-day-pink transition">${country ? country.flag + ' ' + country.name : 'Country'}</button>
                    <span class="text-day-muted">›</span>
                    <span class="text-day-pink font-bold">📍 ${activeCityForBubble ? activeCityForBubble.name : 'City'}</span>
                `;
                if (returnBtnContainer) returnBtnContainer.classList.remove('hidden');
            }
        }

        function positionElementOverCity(element, lat, lng) {
            if (!map) return;
            const latLng = L.latLng(lat, lng);
            const point = map.latLngToContainerPoint(latLng);
            element.style.left = `${point.x}px`;
            element.style.top = `${point.y}px`;
        }

        function updateBubblePosition() {
            if (!activeCityForBubble) return;
            const bubble = document.getElementById('personSpeechBubble');
            if (!bubble.classList.contains('hidden')) {
                positionElementOverCity(bubble, activeCityForBubble.latitude, activeCityForBubble.longitude);
            }
            const card = document.getElementById('cityPeopleCard');
            if (!card.classList.contains('hidden')) {
                positionElementOverCity(card, activeCityForBubble.latitude, activeCityForBubble.longitude);
            }
        }

        function playPersonAudio() {
            if (!currentSelectedPerson) return;
            const lang = appData.languages.find(l => l.id === currentSelectedPerson.language_id);
            if (!lang || !lang.audio_url) {
                alert('目前尚未提供真人語音檔案');
                return;
            }

            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
            }

            currentAudioPlayer = new Audio(lang.audio_url);
            const btn = document.getElementById('audioPlayBtn');
            const icon = document.getElementById('audioIcon');
            const text = document.getElementById('audioBtnText');

            if (btn) btn.classList.add('animate-pulse');
            if (icon) icon.className = 'fa-solid fa-volume-high text-day-yellow';
            if (text) text.innerText = '播放中...';

            currentAudioPlayer.play().catch(e => {
                console.warn('Audio play failed:', e);
                resetAudioBtn();
            });

            currentAudioPlayer.onended = resetAudioBtn;
            currentAudioPlayer.onerror = resetAudioBtn;
        }

        function resetAudioBtn() {
            const btn = document.getElementById('audioPlayBtn');
            const icon = document.getElementById('audioIcon');
            const text = document.getElementById('audioBtnText');
            if (btn) btn.classList.remove('animate-pulse');
            if (icon) icon.className = 'fa-solid fa-volume-high';
            if (text) text.innerText = '🔊 播放真人語音';
        }

        function renderCountryCarousel() {
            const carousel = document.getElementById('countryCarousel');
            carousel.innerHTML = '';

            appData.countries.forEach(country => {
                const btn = document.createElement('button');
                btn.className = 'flex items-center space-x-2 px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-day-pink/10 border border-day-border dark:border-night-border rounded-2xl text-xs font-bold text-day-text dark:text-night-text shrink-0 transition hover:scale-105 shadow-sm';
                btn.innerHTML = `
                    <span class="text-base">${country.flag}</span>
                    <span>${country.name}</span>
                `;
                btn.onclick = () => flyToCountry(country.id);
                carousel.appendChild(btn);
            });
        }

        function populateLanguageFilterOptions() {
            const select = document.getElementById('langFilterSelect');
            select.innerHTML = '<option value="all">🌍 All Languages</option>';
            appData.languages.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l.id;
                opt.textContent = `${l.name} (${l.native_name})`;
                select.appendChild(opt);
            });
        }

        function handleLanguageFilter(langId) {
            activeLanguageFilter = langId;
            renderWorldView(langId);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-sun text-day-yellow';
                map.removeLayer(window.nightTileLayer);
                window.dayTileLayer.addTo(map);
                localStorage.setItem('theme', 'day');
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-moon text-night-yellow';
                map.removeLayer(window.dayTileLayer);
                window.nightTileLayer.addTo(map);
                localStorage.setItem('theme', 'night');
            }
        }

        if (localStorage.getItem('theme') === 'day') {
            document.documentElement.classList.remove('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-sun text-day-yellow';
        } else {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-moon text-night-yellow';
        }

        window.onload = () => {
            initMap();
        };
    </script>
</body>
</html>
