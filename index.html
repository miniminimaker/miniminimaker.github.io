<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>miniminimaker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f3ef;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 30px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 36px;
        }

        .subtitle {
            margin: 0;
            color: #777;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .card {
            display: block;
            padding: 45px 35px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 18px;
            text-decoration: none;
            color: inherit;
            text-align: center;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 18px;
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        .card p {
            margin: 0;
            color: #777;
            line-height: 1.6;
        }

        footer {
            margin-top: 70px;
            text-align: center;
            color: #888;
            font-size: 14px;
            line-height: 2;
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            .container {
                padding: 40px 20px;
            }

            .categories {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header>
            <img
                src="logo.png"
                alt="miniminimaker logo"
                class="logo"
            >

            <h1>miniminimaker</h1>

            <p class="subtitle">
                My personal space &amp; KY archive
            </p>
        </header>


        <section class="categories">

            <!-- About Me -->
            <a
                href="/about/"
                class="card"
            >
                <div class="icon">👤</div>

                <h2>About Me</h2>

                <p>
                    About me, commissions,<br>
                    and my creative work.
                </p>
            </a>


            <!-- Kyrio Cifer -->
            <a
                href="/kyriocifer/"
                class="card"
            >
                <div class="icon">🦋</div>

                <h2>Kyrio Cifer</h2>

                <p>
                    A collection of KY's<br>
                    stream projects and archives.
                </p>
            </a>

        </section>


        <footer>

            <div>
                Made with ♡ by
                <a
                    href="https://x.com/miniminimaker"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    miniminimaker
                </a>
            </div>

            <div>
                © 2026
                <a
                    href="https://x.com/miniminimaker"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    miniminimaker
                </a>
            </div>

        </footer>

    </main>

</body>
</html>
