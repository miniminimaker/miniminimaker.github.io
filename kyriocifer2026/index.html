<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE AROUND THE WORLD ♡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        night: {
                            bg: '#080D1A', sky: '#111827', pink: '#F43F5E', lavender: '#8B5CF6',
                            yellow: '#FBBF24', text: '#F8FAFC', muted: '#94A3B8', border: '#1E293B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .leaflet-container { width: 100%; height: 100%; background: #080D1A !important; transition: background 0.5s ease; }
        
        .dark .leaflet-tile-pane {
            filter: brightness(0.9) contrast(1.08) saturate(0.75);
        }

        @keyframes heart-gentle-pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.7)); }
            50% { transform: scale(1.22); filter: drop-shadow(0 0 14px rgba(251, 191, 36, 0.95)); }
        }
        .city-heart-marker {
            animation: heart-gentle-pulse 2.5s infinite ease-in-out;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            display: flex; align-items: center; justify-content: center;
            color: #FBBF24; font-size: 20px; user-select: none; font-weight: 800;
        }
        .city-heart-marker:hover {
            transform: scale(1.4); filter: drop-shadow(0 0 18px rgba(251, 191, 36, 1));
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glow-pink-text {
            text-shadow: 0 0 16px rgba(244, 63, 94, 0.6);
        }
    </style>
</head>
<body class="h-full bg-night-bg text-night-text flex flex-col overflow-hidden">

    <header class="bg-slate-900/80 backdrop-blur-md border-b border-night-border px-4 py-3 flex items-center justify-center z-40 shrink-0">
        <div class="flex items-center space-x-3 cursor-pointer group" onclick="returnToWorldView()">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-night-pink to-night-yellow flex items-center justify-center shadow-md shadow-night-pink/20 group-hover:scale-105 transition">
                <i class="fa-solid fa-earth-americas text-white text-lg"></i>
            </div>
            <div>
                <h1 id="headerTitle" class="font-extrabold text-base sm:text-lg bg-gradient-to-r from-night-pink to-night-lavender bg-clip-text text-transparent flex items-center gap-1.5 uppercase tracking-wide">
                    LOVE AROUND THE WORLD ♡
                </h1>
                <p class="text-xs text-night-muted">Light up the world, hear the languages of love ✨</p>
            </div>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden flex flex-col">
        <div id="map" class="w-full h-full absolute inset-0 z-10"></div>

        <div id="breadcrumbOverlay" class="absolute top-4 left-4 z-20 flex items-center bg-slate-900/80 backdrop-blur-md px-5 py-2.5 rounded-full border border-slate-700 shadow-xl text-xs font-semibold pointer-events-auto">
            <div id="breadcrumbTrail" class="flex items-center space-x-2 text-slate-300">
                <!-- Breadcrumbs injected via JS -->
            </div>
        </div>

        <div id="cityPopupCard" class="absolute z-30 bg-[#121826] border border-slate-700/80 rounded-[28px] shadow-2xl p-6 w-[340px] hidden transform -translate-x-1/2 -translate-y-full mb-4 pointer-events-auto animate-in fade-in zoom-in-95 duration-200">
            <div class="absolute -bottom-2.5 left-1/2 transform -translate-x-1/2 w-5 h-5 bg-[#121826] border-r border-b border-slate-700/80 rotate-45"></div>
            
            <div class="absolute top-4 left-4 flex items-center space-x-1.5">
                <button onclick="returnToWorldView()" class="w-7 h-7 rounded-full bg-slate-800/80 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition" title="Back to World">
                    <i class="fa-solid fa-earth-americas text-[11px]"></i>
                </button>
                <button onclick="flyToCountry(activeCityForBubble?.country_id)" class="w-7 h-7 rounded-full bg-slate-800/80 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition" title="Back to Country">
                    <i class="fa-solid fa-arrow-left text-[11px]"></i>
                </button>
            </div>

            <button onclick="closeCityPopup()" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-slate-800/80 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition" title="Close">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>

            <div class="flex flex-col items-center text-center pb-4 border-b border-slate-800 mt-2">
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.15em] flex items-center space-x-1 mb-3">
                    <i class="fa-solid fa-location-dot text-night-pink"></i>
                    <span id="popupLocation">COUNTRY • CITY</span>
                </div>
                
                <div id="popupLovePhrase" class="text-[32px] font-black text-white glow-pink-text mb-1 leading-tight tracking-wider">我愛你</div>
                <div id="popupRomanization" class="text-sm font-medium text-slate-300 mb-3 tracking-wide">Wǒ ài nǐ</div>
                
                <div id="popupLanguageTag" class="bg-slate-800 border border-slate-700 rounded-full px-4 py-1 text-[11px] text-slate-300 font-semibold tracking-wider">
                    Mandarin
                </div>
            </div>

            <div id="popupPeopleList" class="flex flex-col gap-1.5 mt-3 max-h-48 overflow-y-auto py-1 no-scrollbar">
            </div>
        </div>

        <div class="absolute bottom-0 inset-x-0 z-20 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 py-3 px-4 overflow-hidden shadow-lg">
            <div id="countryCarousel" class="flex items-center space-x-2.5 overflow-x-auto no-scrollbar py-1 px-1 whitespace-nowrap">
            </div>
        </div>
    </main>

    <script>
        const YOUR_SUPABASE_URL = 'https://sxuwpcvdnbzettdmrclo.supabase.co';
        const YOUR_SUPABASE_ANON_KEY = 'sb_publishable_YIg5VkT5PG3vZ6zIwTWZhA_Vf9v3Zq6';
        let supabaseClient = null;

        try {
            if (supabase && YOUR_SUPABASE_URL && YOUR_SUPABASE_ANON_KEY) {
                supabaseClient = supabase.createClient(YOUR_SUPABASE_URL, YOUR_SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn('Supabase initialization failed:', e);
        }

        const demoData = {
            countries: [{ id: 'c_tw', name: 'Taiwan', name_en: 'Taiwan', flag: '🇹🇼' }],
            cities: [{ id: 'ci_taipei', country_id: 'c_tw', name: 'Taipei', name_en: 'Taipei', latitude: 25.0330, longitude: 121.5654 }],
            languages: [{ id: 'l_mandarin', name: 'Mandarin', native_name: '中文', love_phrase: '我愛你', romanization: 'Wǒ ài nǐ' }],
            people: [{ id: 'p1', name: 'MINI (Connecting...)', avatar_url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', country_id: 'c_tw', city_id: 'ci_taipei', language_id: 'l_mandarin', active: true }]
        };

        let appData = JSON.parse(JSON.stringify(demoData));
        let map;
        let markersLayer = L.layerGroup();
        let activeCityForBubble = null;
        let activeCountryId = null;
        let currentMapLevel = 'world'; 
        
        let currentAudioPlayer = null;
        let currentActiveBtnId = null;
        let currentActiveIconId = null;
        let autoScrollInterval = null;
        let isCarouselHovered = false;

        async function initMap() {
            map = L.map('map', {
                zoomControl: false, attributionControl: false, minZoom: 3, maxZoom: 16,
                maxBounds: [[-85, -180], [85, 180]], maxBoundsViscosity: 1.0
            }).setView([20.0, 0.0], 3);

            window.nightTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, minZoom: 3, noWrap: true });
            window.nightTileLayer.addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);
            markersLayer.addTo(map);

            await fetchAppData();
            renderWorldView();
            renderCountryCarousel();
            updateBreadcrumb();

            map.on('move zoom', updateBubblePosition);
            
            setInterval(fetchAppDataSilent, 10000);
        }

        function preprocessData() {
            appData.people.forEach(person => {
                if (person.country_id && !person.city_id) {
                    const virtualCityId = 'virtual_city_' + person.country_id;
                    let virtualCity = appData.cities.find(c => c.id === virtualCityId);
                    
                    if (!virtualCity) {
                        const country = appData.countries.find(c => c.id === person.country_id);
                        if (country) {
                            const lat = (country.latitude !== null && country.latitude !== undefined) ? country.latitude : 0;
                            const lng = (country.longitude !== null && country.longitude !== undefined) ? country.longitude : 0;
                            
                            virtualCity = {
                                id: virtualCityId,
                                country_id: country.id,
                                name: 'Somewhere in ' + (country.name_en || country.name || 'Country'),
                                name_en: 'Somewhere in ' + (country.name_en || country.name || 'Country'),
                                latitude: lat,
                                longitude: lng
                            };
                            appData.cities.push(virtualCity);
                        }
                    }
                    
                    if (virtualCity) {
                        person.city_id = virtualCity.id;
                    }
                }
            });
        }

        async function fetchAppData() {
            if (!supabaseClient) return;
            try {
                const [coRes, ciRes, lRes, pRes] = await Promise.all([
                    supabaseClient.from('countries').select('*'),
                    supabaseClient.from('cities').select('*'),
                    supabaseClient.from('languages').select('*'),
                    supabaseClient.from('people').select('*')
                ]);
                
                if (coRes.data) appData.countries = coRes.data;
                if (ciRes.data) appData.cities = ciRes.data;
                if (lRes.data) appData.languages = lRes.data;
                if (pRes.data) appData.people = pRes.data;
                
                preprocessData();
            } catch (err) { console.log('Data fetch err:', err); }
        }

        async function fetchAppDataSilent() {
            await fetchAppData();
            if (currentMapLevel === 'world') {
                renderWorldView();
            } else if (currentMapLevel === 'city' && activeCityForBubble) {
                const updatedCity = appData.cities.find(c => c.id === activeCityForBubble.id);
                if (updatedCity) {
                    const cityPeople = appData.people.filter(p => p.active && p.city_id === updatedCity.id);
                    if (cityPeople.length > 0) showCityPopup(updatedCity, cityPeople, true);
                }
            }
        }

        function renderWorldView() {
            markersLayer.clearLayers();
            currentMapLevel = 'world';
            activeCountryId = null;
            closeCityPopup();
            updateBreadcrumb();

            const activePeople = appData.people.filter(p => p.active);
            const activeCityIds = new Set(activePeople.map(p => p.city_id));

            appData.cities.forEach(city => {
                if (!activeCityIds.has(city.id)) return;
                const country = appData.countries.find(c => c.id === city.country_id);
                const cityPeople = activePeople.filter(p => p.city_id === city.id);
                if (cityPeople.length === 0) return;
                
                const cityName = city.name_en || city.name;
                const countryName = country ? (country.name_en || country.name) : '';

                const heartHtml = `<div class="city-heart-marker" title="${cityName}">♥</div>`;
                const icon = L.divIcon({ className: 'custom-heart-icon', html: heartHtml, iconSize: [28, 28], iconAnchor: [14, 14] });
                const marker = L.marker([city.latitude, city.longitude], { icon });

                marker.bindTooltip(`
                    <div class="p-1 font-sans text-xs">
                        <div class="font-bold text-slate-900 dark:text-white text-sm">📍 ${cityName}</div>
                        <div class="text-night-pink font-semibold">${country ? country.flag + ' ' + countryName : ''}</div>
                        <div class="text-slate-500 text-[11px] mt-0.5">${cityPeople.length} people here</div>
                    </div>
                `, { direction: 'top', offset: [0, -8] });

                marker.on('click', () => handleCityClick(city, cityPeople));
                markersLayer.addLayer(marker);
            });
        }

        function flyToCountry(countryId) {
            const country = appData.countries.find(c => c.id === countryId);
            if (!country) return;

            currentMapLevel = 'country';
            activeCountryId = country.id;
            closeCityPopup();
            updateBreadcrumb();

            const activePeople = appData.people.filter(p => p.active && p.country_id === countryId);
            const countryCityIds = new Set(activePeople.map(p => p.city_id));
            const activeCities = appData.cities.filter(c => c.country_id === countryId && countryCityIds.has(c.id));

            if (activeCities.length > 0) {
                const bounds = L.latLngBounds(activeCities.map(c => [c.latitude, c.longitude]));
                map.flyToBounds(bounds, { padding: [80, 80], maxZoom: 6, duration: 1.5 });
            }

            markersLayer.clearLayers();
            activeCities.forEach(city => {
                const cityPeople = activePeople.filter(p => p.city_id === city.id);
                if (cityPeople.length === 0) return;

                const cityName = city.name_en || city.name;
                const countryName = country.name_en || country.name;

                const heartHtml = `<div class="city-heart-marker" title="${cityName}">♥</div>`;
                const icon = L.divIcon({ className: 'custom-heart-icon', html: heartHtml, iconSize: [28, 28], iconAnchor: [14, 14] });
                const marker = L.marker([city.latitude, city.longitude], { icon });
                
                marker.bindTooltip(`
                    <div class="p-1 font-sans text-xs">
                        <div class="font-bold text-slate-900 dark:text-white text-sm">📍 ${cityName}</div>
                        <div class="text-night-pink font-semibold">${country.flag} ${countryName}</div>
                        <div class="text-slate-500 text-[11px] mt-0.5">${cityPeople.length} people here</div>
                    </div>
                `, { direction: 'top', offset: [0, -8] });
                
                marker.on('click', () => handleCityClick(city, cityPeople));
                markersLayer.addLayer(marker);
            });
        }

        function handleCityClick(city, cityPeople) {
            currentMapLevel = 'city';
            activeCityForBubble = city;
            updateBreadcrumb();
            map.flyTo([city.latitude, city.longitude], 11, { duration: 1.2 });
            showCityPopup(city, cityPeople);
        }

        function showCityPopup(city, people, isSilent = false) {
            activeCityForBubble = city;
            
            const country = appData.countries.find(c => c.id === city.country_id);
            const cityName = city.name_en || city.name || '';
            const countryName = country ? (country.name_en || country.name) : '';
            
            const lang = appData.languages.find(l => l.id === people[0].language_id);
            
            const lovePhrase = lang ? (lang.love_phrase || lang.native_name) : 'I love you';
            const romanization = lang ? (lang.romanization || '') : '';
            const langName = lang ? (lang.name_en || lang.name || 'Language') : 'Language';

            document.getElementById('popupLocation').innerText = `${countryName} • ${cityName}`;
            document.getElementById('popupLovePhrase').innerText = lovePhrase;
            document.getElementById('popupRomanization').innerText = romanization;
            document.getElementById('popupLanguageTag').innerText = langName;

            const listContainer = document.getElementById('popupPeopleList');
            if (!isSilent) listContainer.innerHTML = ''; 
            
            let newHtml = '';
            people.forEach(p => {
                const pLang = appData.languages.find(l => l.id === p.language_id);
                const audioUrl = p.audio_url || (pLang ? pLang.audio_url : '');
                const hasAudio = !!(audioUrl && audioUrl !== 'undefined' && audioUrl.trim() !== '');
                
                if (hasAudio) {
                    newHtml += `
                        <div class="flex items-center justify-between bg-slate-800/40 p-2.5 rounded-2xl hover:bg-slate-800/80 border border-transparent hover:border-slate-700 transition cursor-pointer group" onclick="playPersonAudio('${audioUrl}', 'playBtn_${p.id}', 'playIcon_${p.id}')">
                            <div class="flex items-center space-x-3 overflow-hidden">
                                <img src="${p.avatar_url}" class="w-10 h-10 rounded-full object-cover border-[1.5px] border-slate-600 group-hover:border-night-pink transition shadow-sm shrink-0" onerror="this.src='https://placehold.co/100x100/1e293b/f43f5e?text=U'">
                                <div class="text-[14px] font-bold text-white group-hover:text-night-pink transition truncate">${p.name}</div>
                            </div>
                            <button id="playBtn_${p.id}" class="w-9 h-9 rounded-full bg-slate-800 group-hover:bg-night-pink/20 border border-slate-600 group-hover:border-night-pink flex items-center justify-center transition shrink-0 shadow-inner ml-2">
                                <i id="playIcon_${p.id}" class="fa-solid fa-play text-slate-300 group-hover:text-night-pink ml-0.5 text-xs transition"></i>
                            </button>
                        </div>
                    `;
                } else {
                    newHtml += `
                        <div class="flex items-center justify-between bg-slate-800/20 p-2.5 rounded-2xl border border-transparent transition">
                            <div class="flex items-center space-x-3 overflow-hidden">
                                <img src="${p.avatar_url}" class="w-10 h-10 rounded-full object-cover border-[1.5px] border-slate-700/60 transition shadow-sm opacity-60 shrink-0" onerror="this.src='https://placehold.co/100x100/1e293b/f43f5e?text=U'">
                                <div class="text-[14px] font-bold text-slate-400 truncate">${p.name}</div>
                            </div>
                        </div>
                    `;
                }
            });
            listContainer.innerHTML = newHtml;

            if (!isSilent) {
                const card = document.getElementById('cityPopupCard');
                card.classList.remove('hidden');
                positionElementOverCity(card, city.latitude, city.longitude);
            }
        }

        function closeCityPopup() {
            document.getElementById('cityPopupCard').classList.add('hidden');
            resetAudioState();
        }

        function playPersonAudio(audioUrl, btnId, iconId) {
            if (!audioUrl || audioUrl === 'undefined') {
                return;
            }

            if (currentActiveBtnId === btnId && currentAudioPlayer) {
                resetAudioState();
                return;
            }

            resetAudioState(); 

            currentAudioPlayer = new Audio(audioUrl);
            currentActiveBtnId = btnId;
            currentActiveIconId = iconId;

            const btn = document.getElementById(btnId);
            const icon = document.getElementById(iconId);

            if (btn) btn.classList.add('animate-pulse', 'border-night-pink', 'shadow-[0_0_12px_rgba(244,63,94,0.4)]');
            if (icon) icon.className = 'fa-solid fa-pause text-night-pink ml-0.5 text-xs';

            currentAudioPlayer.play().catch(e => {
                console.warn('Audio play failed:', e);
                resetAudioState();
            });

            currentAudioPlayer.onended = resetAudioState;
            currentAudioPlayer.onerror = resetAudioState;
        }

        function resetAudioState() {
            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
                currentAudioPlayer = null;
            }
            if (currentActiveBtnId) {
                const btn = document.getElementById(currentActiveBtnId);
                const icon = document.getElementById(currentActiveIconId);
                
                if (btn) btn.classList.remove('animate-pulse', 'border-night-pink', 'shadow-[0_0_12px_rgba(244,63,94,0.4)]');
                if (icon) icon.className = 'fa-solid fa-play text-slate-300 group-hover:text-night-pink ml-0.5 text-xs';
                
                currentActiveBtnId = null;
                currentActiveIconId = null;
            }
        }

        function returnToWorldView() {
            closeCityPopup();
            currentMapLevel = 'world';
            activeCityForBubble = null;
            activeCountryId = null;
            map.flyTo([20.0, 0.0], 3, { duration: 1.5 });
            renderWorldView();
        }

        function positionElementOverCity(element, lat, lng) {
            if (!map) return;
            const latLng = L.latLng(lat, lng);
            const point = map.latLngToContainerPoint(latLng);
            element.style.left = `${point.x}px`;
            element.style.top = `${point.y - 10}px`;
        }

        function updateBubblePosition() {
            if (!activeCityForBubble) return;
            const card = document.getElementById('cityPopupCard');
            if (!card.classList.contains('hidden')) {
                positionElementOverCity(card, activeCityForBubble.latitude, activeCityForBubble.longitude);
            }
        }

        function updateBreadcrumb() {
            const trail = document.getElementById('breadcrumbTrail');
            if (!trail) return;

            if (currentMapLevel === 'world') {
                trail.innerHTML = `<button onclick="returnToWorldView()" class="text-white font-extrabold flex items-center space-x-1.5 tracking-wide hover:text-night-pink transition cursor-pointer"><i class="fa-solid fa-earth-americas text-night-pink"></i><span>World View</span></button>`;
            } else {
                const targetCountryId = currentMapLevel === 'city' ? activeCityForBubble?.country_id : activeCountryId;
                const country = appData.countries.find(c => c.id === targetCountryId);
                const countryName = country ? (country.name_en || country.name) : 'Country';
                
                trail.innerHTML = `
                    <button onclick="returnToWorldView()" class="hover:text-white transition flex items-center gap-1.5"><i class="fa-solid fa-earth-americas text-[10px]"></i> World</button>
                    <span class="text-slate-600">›</span>
                    <button onclick="flyToCountry('${country?.id}')" class="text-white font-bold tracking-wide hover:text-night-pink transition">${country ? country.flag + ' ' + countryName : 'Country'}</button>
                `;
            }
        }

        function renderCountryCarousel() {
            const carousel = document.getElementById('countryCarousel');
            carousel.innerHTML = '';
            
            // Duplicate array for seamless infinite looping
            const loopCountries = [...appData.countries, ...appData.countries, ...appData.countries];
            
            loopCountries.forEach(country => {
                const countryName = country.name_en || country.name;
                const btn = document.createElement('button');
                btn.className = 'flex items-center space-x-2 px-5 py-2 bg-slate-800 border border-slate-700 hover:border-night-pink/50 rounded-full text-xs font-bold text-slate-200 shrink-0 transition hover:scale-105 shadow-sm cursor-pointer';
                btn.innerHTML = `<span class="text-base">${country.flag}</span><span>${countryName}</span>`;
                btn.onclick = () => flyToCountry(country.id);
                carousel.appendChild(btn);
            });

            if (!autoScrollInterval) {
                carousel.addEventListener('mouseenter', () => { isCarouselHovered = true; });
                carousel.addEventListener('mouseleave', () => { isCarouselHovered = false; });
                carousel.addEventListener('touchstart', () => { isCarouselHovered = true; }, { passive: true });
                carousel.addEventListener('touchend', () => { isCarouselHovered = false; }, { passive: true });

                autoScrollInterval = setInterval(() => {
                    if (!isCarouselHovered && carousel) {
                        carousel.scrollLeft += 0.2; // Slower speed (0.2px per tick)
                        if (carousel.scrollLeft >= carousel.scrollWidth / 3) {
                            carousel.scrollLeft = 0;
                        }
                    }
                }, 20);
            }
        }

        window.onload = () => initMap();
    </script>
</body>
</html>
