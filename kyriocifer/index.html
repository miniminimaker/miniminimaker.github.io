<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kyrio Cifer Hub - miniminimaker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f5f3ef; /* 配合主頁的背景色 */
            color: #333;
            display: flex;
            flex-direction: column;
        }

        /* 移除了原本的 header 與 header-inner 樣式，讓版面更純粹 */

        main {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            /* 調整上方的留白 (80px)，給予舒適的呼吸空間 */
            padding: 80px 24px 70px;
            flex: 1;
        }

        .intro {
            text-align: center;
            margin-bottom: 50px;
        }

        /* 為放在內容區的 LOGO 重新設計樣式 */
        .intro-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            display: block;
            margin: 0 auto 24px auto; /* 置中並與下方文字拉開距離 */
            border-radius: 28px;
            background-color: #ffffff; /* 給予乾淨的白底 */
            padding: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04); /* 增加一點點立體陰影 */
            transition: transform 0.3s ease;
        }

        .intro-logo:hover {
            transform: translateY(-3px);
        }

        .intro h2 {
            margin: 0 0 12px;
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .intro p {
            margin: 0;
            color: #777;
            font-size: 15px;
            line-height: 1.8;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
        }

        /* ===== 極簡風卡片設計 ===== */
        .card {
            background: #ffffff;
            border: none; /* 移除邊框 */
            border-radius: 20px;
            padding: 32px 28px;
            text-decoration: none;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 靠左對齊 */
            text-align: left;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); /* 柔和的常駐陰影 */
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08); /* 懸停時加深陰影，增加立體感 */
        }

        .card:focus-visible {
            outline: 2px solid #999;
            outline-offset: 3px;
        }

        /* 將 Emoji 收斂在精緻的小方塊內 */
        .card-icon {
            font-size: 24px;
            width: 48px;
            height: 48px;
            background: #f8f6f3; /* 配合背景色的超淺底色 */
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.05); /* 懸停時圖示微微放大 */
        }

        .card-info {
            flex: 1;
            width: 100%;
        }

        .card-info h3 {
            margin: 0 0 6px;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 加入一個懸停時才會微微移動的箭頭，增加互動感 */
        .card-info h3::after {
            content: "→";
            font-weight: normal;
            color: #ccc;
            font-family: Arial, sans-serif;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .card:hover .card-info h3::after {
            transform: translateX(4px);
            color: #888;
        }

        .card-info p {
            margin: 0;
            font-size: 13px;
            color: #888;
            letter-spacing: 0.5px;
        }

        /* 將色塊改為極簡的狀態點點 */
        .card-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #aaa;
            margin-top: 24px;
            letter-spacing: 0.5px;
        }

        .card-status::before {
            content: "";
            display: block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #d8cfc0; /* 柔和的圓點顏色 */
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #888;
            font-size: 13px;
        }

        footer p {
            margin: 0;
        }

        footer a {
            color: #777;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #333;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            main {
                /* 手機版適度縮減上方留白 */
                padding: 50px 20px 50px;
            }

            .intro-logo {
                width: 85px;
                height: 85px;
                margin-bottom: 20px;
                border-radius: 22px;
            }

            .intro h2 {
                font-size: 24px;
            }

            .cards {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .card {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- 移除了原先空蕩的 Header 區塊，讓主內容直接呈現 -->

    <main>
        <section class="intro">
            <!-- 將蝴蝶 LOGO 移至標題上方，並確保圖片路徑正確 -->
            <img src="image_d6b17b.png" alt="Kyrio Cifer Logo" class="intro-logo">
            <h2>Kyrio Cifer Hub</h2>
            <p>Updated Occasionally｜不定期更新</p>
        </section>

        <section class="cards">
            
            <!-- Stream Archive -->
            <a href="archive/" class="card">
                <div class="card-icon">🔴</div>
                <div class="card-info">
                    <h3>Stream Archive</h3>
                    <p>直播資訊</p>
                </div>
                <div class="card-status">Under Construction · 建設中</div>
            </a>

            <!-- Other Info -->
            <a href="other/" class="card">
                <div class="card-icon">📂</div>
                <div class="card-info">
                    <h3>Other Info</h3>
                    <p>其他資訊</p>
                </div>
                <div class="card-status">Under Construction · 建設中</div>
            </a>
            
            <!-- Games -->
            <a href="https://miniminimaker.github.io/kyriocifer/games/" class="card">
                <div class="card-icon">🎮</div>
                <div class="card-info">
                    <h3>Stream Games Archive</h3>
                    <p>直播遊戲列表</p>
                </div>
            </a>
            
            <!-- Music -->
            <a href="https://miniminimaker.github.io/kyriocifer/music/" class="card">
                <div class="card-icon">🎵</div>
                <div class="card-info">
                    <h3>Stream Music Playlist</h3>
                    <p>直播音樂清單</p>
                </div>
            </a>
            
            <!-- miniminiproject -->
            <a href="https://kyriory.carrd.co/" target="_blank" rel="noopener noreferrer" class="card">
                <div class="card-icon">✨</div>
                <div class="card-info">
                    <h3>miniminiproject</h3>
                    <p>minimini粉絲企劃</p>
                </div>
            </a>

        </section>

    </main>

    <footer>
        <p>
            © 2026
            <a href="https://x.com/miniminimaker" target="_blank" rel="noopener noreferrer">
                miniminimaker
            </a>
        </p>
    </footer>

</body>
</html>
